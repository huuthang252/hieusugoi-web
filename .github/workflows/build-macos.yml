name: build-macos

on:
  workflow_dispatch:
  push:
    branches:
      - mac-port-v2.2.1-clean

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS app
        run: |
          pyinstaller Hieusugoi_mac.spec

      - name: Zip app
        run: |
          cd dist
          zip -r Hieusugoi-macOS.zip Hieusugoi.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hieusugoi-macOS
          path: dist/Hieusugoi-macOS.zip
